name: picaku_stt_demo
description: "Standalone spike: on-device English transcription with sherpa-onnx + Moonshine INT8 + Silero VAD. Validates the engine before integration into the main Picaku app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  # Engine: ONNX Runtime based ASR/VAD (models ship as downloads, not code).
  # No pubspec.lock is committed, so CI has always resolved the newest 1.x -
  # this constraint just makes the version we actually build against explicit.
  sherpa_onnx: ^1.13.4
  # Mic capture - same package and major version as the main Picaku app.
  record: ^6.2.0
  path_provider: ^2.1.0
  # In-app model download (download-once-and-cache). Same version as main app.
  http: ^1.6.0
  # Keeps the screen on while recording. The demo has no foreground service on
  # purpose (that shell lives in the main app); screen-off would suspend the mic.
  wakelock_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # No bundled assets: models are downloaded in-app (lib/models/) from the
  # official sherpa-onnx mirrors and cached in app storage. Keeps the APK small.
